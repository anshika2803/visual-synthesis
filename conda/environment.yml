# Conda environment for Linux / HPC.
#
#   make conda-env && make conda-install     # or, by hand:
#   conda env create -f conda/environment.yml
#   conda activate visual-safety
#
#   pip install -e ".[all]"        # from the repository root
#
# conda installs the compiled stack (torch + CUDA); the `pip:` block below
# mirrors pyproject.toml -- the core dependencies plus every extra -- so pip
# only has to add the project itself. Keep the two files in sync when a
# dependency changes. Match pytorch-cuda to your cluster's driver (`nvidia-smi`).
name: visual-safety
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11 # pyproject requires-python: >=3.11,<3.13
  - pip
  # [project.optional-dependencies].gpu: torch from the pytorch channel (CUDA build).
  - pytorch>=2.3
  - torchvision>=0.18
  - pytorch-cuda=12.1
  - pip:
      # [project].dependencies -- enough for the data stages (download, standardize, unify, postprocess)
      - click>=8.1
      - pandas>=2.2
      - pyarrow>=16.1
      - numpy>=1.26
      - pillow>=10.3
      - huggingface-hub>=0.24
      - tqdm>=4.66
      # [project.optional-dependencies].gpu -- image generation (torch / torchvision above)
      - diffusers>=0.30
      - transformers>=4.41
      - accelerate>=0.32
      - safetensors>=0.4
      - sentencepiece>=0.2
      - protobuf>=4.25
      - psutil>=5.9
      # [project.optional-dependencies].nsfw -- the NudeNet detector
      - nudenet>=3.4.2
      - onnxruntime>=1.17
      # [project.optional-dependencies].serve -- the HTTP API
      - fastapi>=0.111
      - uvicorn>=0.30
      - python-multipart>=0.0.9
      # [project.optional-dependencies].ui -- the web UI
      - gradio>=4.36
      # [project.optional-dependencies].metrics -- optional CLIP/FID backends
      - matplotlib>=3.8
      - torchmetrics>=1.4
      - torch-fidelity>=0.3
      # [project.optional-dependencies].dev -- tests and lint
      - pytest>=8.2
      - ruff>=0.5
      - httpx>=0.27
