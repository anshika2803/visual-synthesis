[project]
name = "visual-synthesis"
version = "0.3.0"
description = "Config-driven, resumable pipeline for a unified text-to-image safety benchmark: download, standardize, unify, deduplicate, generate images, detect NSFW."
authors = [{ name = "Tanweerul Haque", email = "tan.haque@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# The core is enough for the data stages (download, standardize, unify, postprocess).
dependencies = [
    "click>=8.1",
    "pandas>=2.2",
    "pyarrow>=16.1",
    "numpy>=1.26",
    "pillow>=10.3",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
# Image generation (and the safety_checker detector).
gpu = [
    "torch>=2.3",
    "torchvision>=0.18",
    "diffusers>=0.30",
    "transformers>=4.41",
    "accelerate>=0.32",
    "safetensors>=0.4",
]
# The NudeNet detector.
nsfw = ["nudenet>=3.4.2", "onnxruntime>=1.17"]
# The HTTP API.
serve = ["fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# The web UI.
ui = ["gradio>=4.36"]
dev = ["pytest>=8.2", "ruff>=0.5", "httpx>=0.27"]
all = ["visual-synthesis[gpu,nsfw,serve,ui,dev]"]

[project.scripts]
visual-synthesis = "visual_synthesis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares request parameters as call defaults: Body(...), Header(None).
"src/visual_synthesis/serving/api.py" = ["B008"]
